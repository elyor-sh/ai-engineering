# Настройки линтера ruff для всего курса.
line-length = 140  # русские строки-подсказки длинные, резать их — хуже для чтения

[lint.isort]
# Локальные вспомогательные модули уроков (лежат рядом со скриптами в practice/).
# Без этого ruff по-разному сортирует импорты в зависимости от папки запуска.
known-local-folder = ["providers"]
