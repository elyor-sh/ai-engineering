[project]
name = "ai-engineering"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openai>=3.46.0",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
docs = [
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.7",
    "properdocs>=1.6.7",
]
